<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Twitter 2015</title>

    <!-- Para instalarla como app (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#55acee">
    <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="twt2015">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="preload" href="fuentes/arimo-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fuentes/arimo-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>

<header class="topbar">
    <div class="topbar-in">
        <nav class="topnav">
            <a href="#/" data-pag="inicio">Inicio</a>
            <a href="#/perfiles" data-pag="perfiles">Perfiles</a>
            <a href="#/mensajes" data-pag="mensajes">Mensajes</a>
        </nav>
        <span id="guardado" class="guardado"></span>
        <button class="btn-tuto" data-accion="tutorial" title="Cómo se usa" aria-label="Cómo se usa la app">?</button>
        <button id="btn-instalar" class="instalar" data-accion="instalar" hidden>Instalar</button>
        <button class="mirador" data-accion="mirador" title="Cuenta desde la que se mira">
            <span class="mirador-txt">Viendo como</span>
            <span id="mirador-av" class="av"></span>
        </button>
    </div>
</header>

<main id="vista"></main>

<!-- Fuera de lo que se descarga: nunca sale en las imágenes -->
<footer class="pie">
    Hecha por <a href="https://github.com/poufortnite" target="_blank" rel="noopener">@poufortnite</a> en GitHub
</footer>

<div id="modal" class="modal" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true">
        <div class="modal-cab">
            <h2 id="modal-titulo"></h2>
            <button class="modal-x" data-accion="cerrar-modal" aria-label="Cerrar">✕</button>
        </div>
        <div id="modal-cuerpo" class="modal-cuerpo"></div>
    </div>
</div>

<div id="aviso" class="aviso" hidden></div>

<!-- Todo va dentro de la app (sin CDN) para que funcione también sin internet -->
<!-- Contador de visitas anónimo (GoatCounter): sin cookies ni datos personales; los tweets y personajes nunca salen del dispositivo -->
<script data-goatcounter="https://twt2015.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<!-- Emojis: Twemoji (https://github.com/jdecked/twemoji), dibujos CC-BY 4.0 de Twitter y colaboradores. Ver emojis/LICENCIA-Twemoji.txt -->
<script src="js/twemoji.min.js"></script>
<script src="js/html-to-image.js"></script>
<script src="js/almacen.js?v=19"></script>
<script src="js/app.js?v=19"></script>
</body>
</html>
